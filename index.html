<!DOCTYPE html>
<html>
<head>
    <title>AR Model Viewer</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            touch-action: manipulation;
        }
        model-viewer {
            width: 100%;
            height: 100%;
        }
        .ar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background: transparent;
        }
    </style>
</head>
<body>
    <!-- Transparent overlay that triggers AR -->
    <div class="ar-overlay" id="ar-overlay"></div>
    
    <model-viewer
        id="model1"
        src="pizzahouma.glb"
        ar
        ar-modes="quick-look"
        camera-controls
        environment-image="neutral"
        alt="3D Model"
    >
        <button slot="ar-button" id="ar-button" style="display: none;"></button>
    </model-viewer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('ar-overlay');
            const arButton = document.getElementById('ar-button');
            
            // Trigger AR on any touch (minimum interaction)
            overlay.addEventListener('click', () => {
                setTimeout(() => {
                    arButton.click();
                    overlay.style.display = 'none'; // Hide after triggering
                }, 100);
            });
            
            // Auto-focus the model viewer (helps with quick triggering)
            setTimeout(() => {
                const modelViewer = document.querySelector('model-viewer');
                modelViewer.focus();
            }, 500);
        });
    </script>
</body>
</html>
